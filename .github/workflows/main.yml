name: CI/CD Pipeline - Docker Hub

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: vitorbernardo2/site-pudim:v1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Subir container e testar resposta HTTP
        run: |
          docker run -d -p 8080:80 --name teste-pudim vitorbernardo2/site-pudim:v1
          sleep 3
          curl --fail http://localhost:8080